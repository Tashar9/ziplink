<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZipStream | Professional Video Experience</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* প্রফেশনাল রিপল লোডার */
        .loader-ripple div {
            position: absolute;
            border: 4px solid #6366f1;
            opacity: 1;
            border-radius: 50%;
            animation: loader-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        .loader-ripple div:nth-child(2) { animation-delay: -0.5s; }
        @keyframes loader-ripple {
            0% { top: 36px; left: 36px; width: 0; height: 0; opacity: 0; }
            5% { top: 36px; left: 36px; width: 0; height: 0; opacity: 1; }
            100% { top: 0px; left: 0px; width: 72px; height: 72px; opacity: 0; }
        }
        /* ভিডিওর ডাউনলোড বাটন লুকানো */
        video::-internal-media-controls-download-button { display:none; }
        video::-webkit-media-controls-enclosure { overflow:hidden; }
        video::-webkit-media-controls-panel { width: calc(100% + 30px); }
        
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>

    <script>
        const URLDataEngine = {
            encode: (obj) => btoa(encodeURIComponent(JSON.stringify(obj))),
            decode: (str) => JSON.parse(decodeURIComponent(atob(str)))
        };

        let loadedVideoParts = [];

        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const streamData = urlParams.get('stream');
            if (streamData) {
                try {
                    loadedVideoParts = URLDataEngine.decode(streamData);
                } catch (e) {
                    console.error("Decode error");
                }
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            if (loadedVideoParts && loadedVideoParts.length > 0) {
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('navbar-header').classList.add('hidden');
                document.getElementById('footer-section').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');

                const partsContainer = document.getElementById('video-parts-list');
                loadedVideoParts.forEach((url, index) => {
                    const btn = document.createElement('button');
                    btn.className = `part-btn w-full px-5 py-4 text-sm font-bold border rounded-2xl transition-all flex items-center justify-between group cursor-pointer ${index === 0 ? 'bg-indigo-600 border-indigo-500 text-white shadow-xl' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-750'}`;
                    btn.innerHTML = `<span>Part ${index + 1}</span> <i class="fa-solid fa-play-circle opacity-0 group-hover:opacity-100 transition-opacity"></i>`;
                    btn.onclick = () => playSelectedPart(index, btn);
                    partsContainer.appendChild(btn);
                });

                playPartSource(0);
            }
        });

        function playSelectedPart(index, activeBtn) {
            document.querySelectorAll('.part-btn').forEach(btn => {
                btn.className = "part-btn w-full px-5 py-4 text-sm font-bold border bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-750 rounded-2xl transition-all flex items-center justify-between group cursor-pointer";
            });
            activeBtn.className = "part-btn w-full px-5 py-4 text-sm font-bold border bg-indigo-600 border-indigo-500 text-white shadow-xl rounded-2xl transition-all flex items-center justify-between group cursor-pointer";
            
            document.getElementById('loading-screen').classList.remove('hidden');
            playPartSource(index);
        }

        function playPartSource(index) {
            const videoPlayer = document.getElementById('customVideoPlayer');
            videoPlayer.src = loadedVideoParts[index];
            videoPlayer.load();
            videoPlayer.onloadeddata = () => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('player-view-wrapper').classList.remove('hidden');
                videoPlayer.play().catch(() => { videoPlayer.controls = true; });
            };
            videoPlayer.onerror = () => {
                alert("ভিডিও ফাইলটি লোড করা যাচ্ছে না।");
                document.getElementById('loading-screen').classList.add('hidden');
            };
        }

        window.addEventListener('contextmenu', e => {
            if(e.target.tagName === 'VIDEO') e.preventDefault();
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-x-hidden selection:bg-indigo-500/30">

    <!-- লোডিং অ্যানিমেশন স্ক্রিন -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center hidden">
        <div class="loader-ripple relative w-[80px] h-[80px] mb-4">
            <div></div><div></div>
        </div>
        <h2 class="text-indigo-400 font-bold text-lg tracking-widest animate-pulse uppercase">Preparing Cinema...</h2>
    </div>

    <!-- প্লেয়ার থিয়েটার মোড (মোবাইল ফ্রেন্ডলি) -->
    <div id="player-view-wrapper" class="fixed inset-0 bg-slate-950 z-40 hidden flex flex-col overflow-y-auto">
        <!-- প্লেয়ার হেডার -->
        <div class="w-full bg-slate-900/80 backdrop-blur border-b border-slate-800 px-5 py-4 flex justify-between items-center shrink-0">
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-2">
                <i class="fa-solid fa-house"></i> EXIT
            </a>
            <div class="text-indigo-400 font-black text-xs tracking-tighter bg-indigo-500/10 px-3 py-1.5 rounded-full border border-indigo-500/20">
                SECURE STREAM ACTIVE
            </div>
        </div>

        <!-- মেইন স্ট্রিমিং এরিয়া -->
        <div class="w-full flex-grow flex flex-col lg:flex-row overflow-visible lg:overflow-hidden bg-black">
            <!-- ভিডিও প্লেয়ার স্ক্রিন -->
            <div class="w-full lg:flex-grow bg-black flex items-center justify-center p-1 sm:p-4 shrink-0 lg:h-full">
                <video id="customVideoPlayer" class="w-full h-auto max-h-[50vh] lg:max-h-full object-contain shadow-2xl shadow-indigo-500/10" controls controlsList="nodownload" playsinline></video>
            </div>
            
            <!-- প্লেলিস্ট/পার্ট সিলেক্টর -->
            <div class="w-full lg:w-[400px] bg-slate-900 p-6 lg:p-8 overflow-visible lg:overflow-y-auto border-t lg:border-t-0 lg:border-l border-slate-800">
                <div class="mb-6">
                    <h3 class="text-xl font-black text-white flex items-center gap-3">
                        <i class="fa-solid fa-layer-group text-indigo-500"></i> Video Playlist
                    </h3>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Select a part to start watching</p>
                </div>
                <!-- বাটন গ্রিড (মোবাইলে ২ কলাম, পিসিতে ১ কলাম) -->
                <div id="video-parts-list" class="grid grid-cols-2 lg:grid-cols-1 gap-3 pb-10 lg:pb-0">
                    <!-- ডাইনামিক পার্ট বাটন এখানে লোড হবে -->
                </div>
            </div>
        </div>
    </div>

    <!-- মেইন ড্যাশবোর্ড (জেনারেটর) -->
    <header id="navbar-header" class="container mx-auto px-6 py-6 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2 font-black text-2xl tracking-tighter text-indigo-500">
            ZIP<span class="text-white">STREAM</span>
        </div>
        <div class="text-[10px] font-black bg-white/5 px-4 py-2 rounded-full border border-white/10 text-slate-400 tracking-widest uppercase">Engine v4.0</div>
    </header>

    <main id="main-content" class="container mx-auto px-5 py-12 flex flex-col items-center justify-center flex-grow">
        <div class="max-w-xl w-full text-center mb-10">
            <h1 class="text-5xl font-black mb-4 tracking-tighter bg-gradient-to-br from-white to-slate-500 bg-clip-text text-transparent italic">
                PRO SHORTENER
            </h1>
            <p class="text-slate-500 font-medium px-4">আপনার ভিডিওর পার্টগুলো যোগ করে একটি সুরক্ষিত শর্ট লিংক তৈরি করুন।</p>
        </div>

        <!-- শর্টনার ফর্ম বক্স -->
        <div class="glass p-6 sm:p-10 rounded-[2.5rem] w-full max-w-xl shadow-2xl shadow-indigo-500/5">
            <div id="dynamic-inputs-wrapper" class="space-y-5 mb-8">
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] ml-2">Video Part 1 (Direct URL)</label>
                    <input type="url" class="video-url-input w-full px-6 py-5 bg-slate-900 border border-white/5 rounded-2xl outline-none focus:border-indigo-500/50 text-sm text-white placeholder-slate-600 transition-all" placeholder="Enter video link here...">
                </div>
            </div>

            <!-- বাটনসমূহ -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="addNewPartField()" class="w-full bg-slate-800 hover:bg-slate-750 text-indigo-400 font-black py-5 rounded-2xl text-xs tracking-widest border border-white/5 transition-all cursor-pointer">
                    + ADD VIDEO PART
                </button>
                <button onclick="buildSecureStream()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-2xl text-xs tracking-widest shadow-xl shadow-indigo-600/20 transition-all cursor-pointer">
                    GENERATE LINK
                </button>
            </div>

            <!-- রেজাল্ট বক্স -->
            <div id="resultBox" class="mt-8 p-6 bg-emerald-500/5 border border-emerald-500/20 rounded-3xl hidden flex-col gap-4 animate-in slide-in-from-bottom-4 duration-500">
                <div class="text-left">
                    <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest block mb-2">Short Link Ready</span>
                    <a id="shortUrl" href="#" target="_blank" class="text-white font-bold text-sm break-all hover:underline underline-offset-4 decoration-indigo-500"></a>
                </div>
                <button onclick="copyLink()" id="copyBtn" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl text-[10px] tracking-[0.3em] uppercase border border-white/5 cursor-pointer">
                    COPY LINK
                </button>
            </div>
        </div>
    </main>

    <footer id="footer-section" class="py-8 text-center text-[10px] font-bold text-slate-600 tracking-[0.4em] uppercase opacity-50">
        Secure Stream Platform &copy; 2026
    </footer>

    <!-- UI Core Logic -->
    <script>
        function addNewPartField() {
            const container = document.getElementById('dynamic-inputs-wrapper');
            const count = document.querySelectorAll('.video-url-input').length + 1;
            const div = document.createElement('div');
            div.className = "flex flex-col gap-2 mt-4 animate-in slide-in-from-top-2 duration-300";
            div.innerHTML = `
                <div class="flex justify-between items-center px-2">
                    <label class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em]">Video Part ${count}</label>
                </div>
                <input type="url" class="video-url-input w-full px-6 py-5 bg-slate-900 border border-white/5 rounded-2xl outline-none focus:border-indigo-500/50 text-sm text-white placeholder-slate-600 transition-all" placeholder="Enter next part link...">
            `;
            container.appendChild(div);
        }

        function buildSecureStream() {
            const inputs = Array.from(document.querySelectorAll('.video-url-input')).map(i => i.value.trim()).filter(v => v !== "");
            if (inputs.length === 0) return alert("Please enter at least one link");
            const final = window.location.origin + window.location.pathname + "?stream=" + URLDataEngine.encode(inputs);
            document.getElementById('shortUrl').textContent = final;
            document.getElementById('shortUrl').href = final;
            document.getElementById('resultBox').style.display = 'flex';
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shortUrl').textContent);
            document.getElementById('copyBtn').textContent = "LINK COPIED!";
            setTimeout(() => { document.getElementById('copyBtn').textContent = "COPY LINK"; }, 2000);
        }
    </script>
</body>
</html>
