<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipStream | Premium Responsive Video Platform</title>
    <!-- Tailwind CSS for Premium UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* প্রফেশনাল রিপল লোডার */
        .loader-ripple div {
            position: absolute;
            border: 4px solid #6366f1;
            opacity: 1;
            border-radius: 50%;
            animation: loader-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        .loader-ripple div:nth-child(2) { animation-delay: -0.5s; }
        @keyframes loader-ripple {
            0% { top: 36px; left: 36px; width: 0; height: 0; opacity: 0; }
            5% { top: 36px; left: 36px; width: 0; height: 0; opacity: 1; }
            100% { top: 0px; left: 0px; width: 72px; height: 72px; opacity: 0; }
        }
        /* ভিডিওর ডাউনলোড বাটন লুকানো */
        video::-internal-media-controls-download-button { display:none; }
        video::-webkit-media-controls-enclosure { overflow:hidden; }
        video::-webkit-media-controls-panel { width: calc(100% + 30px); }
        body { -webkit-tap-highlight-color: transparent; }
    </style>

    <script>
        // ইউআরএল ডেটা ইঞ্জিন
        const URLDataEngine = {
            encode: function(obj) {
                return btoa(encodeURIComponent(JSON.stringify(obj)));
            },
            decode: function(str) {
                return JSON.parse(decodeURIComponent(atob(str)));
            }
        };

        let loadedVideoParts = [];

        // ইউআরএল প্যারামিটার রিড
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const streamData = urlParams.get('stream');
            if (streamData) {
                try {
                    loadedVideoParts = URLDataEngine.decode(streamData);
                } catch (e) {
                    console.error("Data decode error:", e);
                }
            }
        })();

        // পেজ প্রস্তুত হলে এলিমেন্ট সেটআপ
        window.addEventListener('DOMContentLoaded', () => {
            if (loadedVideoParts && loadedVideoParts.length > 0) {
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('navbar-header').classList.add('hidden');
                document.getElementById('footer-section').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');

                // পার্ট সিলেক্টর বাটন জেনারেট
                const partsContainer = document.getElementById('video-parts-list');
                loadedVideoParts.forEach((url, index) => {
                    const btn = document.createElement('button');
                    btn.className = `part-btn w-full px-4 py-3 text-sm font-bold border rounded-xl transition flex items-center justify-center gap-2 cursor-pointer ${index === 0 ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' : 'bg-slate-800 border-slate-700 text-slate-300'}`;
                    btn.innerHTML = `<i class="fa-solid fa-circle-play text-xs"></i> Part ${index + 1}`;
                    btn.onclick = () => playSelectedPart(index, btn);
                    partsContainer.appendChild(btn);
                });

                playPartSource(0);
            }
        });

        function playSelectedPart(index, activeBtn) {
            document.querySelectorAll('.part-btn').forEach(btn => {
                btn.className = "part-btn w-full px-4 py-3 text-sm font-bold border bg-slate-800 border-slate-700 text-slate-300 transition flex items-center justify-center gap-2 cursor-pointer";
            });
            activeBtn.className = "part-btn w-full px-4 py-3 text-sm font-bold border bg-indigo-600 border-indigo-500 text-white shadow-lg transition flex items-center justify-center gap-2 cursor-pointer";
            
            document.getElementById('loading-screen').classList.remove('hidden');
            playPartSource(index);
        }

        function playPartSource(index) {
            const videoUrl = loadedVideoParts[index];
            const videoPlayer = document.getElementById('customVideoPlayer');
            
            videoPlayer.src = videoUrl;
            videoPlayer.load();

            videoPlayer.onloadeddata = function() {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('player-view-wrapper').classList.remove('hidden');
                videoPlayer.play().catch(() => {
                    videoPlayer.controls = true;
                });
            };

            videoPlayer.onerror = function() {
                alert("ভিডিও ফাইলটি লোড করা যাচ্ছে না।");
                document.getElementById('loading-screen').classList.add('hidden');
            };
        }

        window.addEventListener('contextmenu', e => {
            if(e.target.tagName === 'VIDEO') e.preventDefault();
        });
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-x-hidden selection:bg-indigo-500/30">

    <!-- ফুল-স্ক্রিন লোডার স্ক্রিন -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center hidden">
        <div class="loader-ripple relative w-[80px] h-[80px] mb-4">
            <div></div>
            <div></div>
        </div>
        <h2 class="text-indigo-400 font-semibold text-lg tracking-wide animate-pulse">Loading Stream...</h2>
    </div>

    <!-- প্লেয়ার ইন্টারফেস (মোবাইলে স্ক্রোল সমর্থন সহ সম্পূর্ণ ফিক্সডLayout মুক্ত) -->
    <div id="player-view-wrapper" class="fixed inset-0 bg-slate-950 z-40 hidden flex flex-col overflow-y-auto">
        <!-- প্লেয়ার হেডার বার -->
        <div class="w-full bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-2">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
            <div class="text-indigo-400 font-bold text-xs bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20">
                <i class="fa-solid fa-shield-halved"></i> Protected Mode
            </div>
        </div>

        <!-- মেইন কন্টেন্ট বডি (মোবাইলে সব ফাইল সিরিয়ালি নিচে নামবে এবং স্ক্রোল হবে) -->
        <div class="w-full flex-grow flex flex-col lg:flex-row overflow-visible lg:overflow-hidden bg-black">
            <!-- ভিডিও প্লেয়ার সেকশন -->
            <div class="w-full lg:flex-grow bg-black flex items-center justify-center p-1 sm:p-2 lg:p-4 lg:h-full shrink-0">
                <video id="customVideoPlayer" class="w-full h-auto max-h-[50vh] lg:max-h-[82vh] object-contain shadow-2xl" controls controlsList="nodownload" playsinline>
                    Your browser does not support the video tag.
                </video>
            </div>
            
            <!-- পার্টস সিলেক্টর প্যানেল -->
            <div class="w-full lg:w-[360px] bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 p-4 sm:p-6 overflow-visible lg:overflow-y-auto">
                <div class="mb-3.5">
                    <h3 class="text-base font-extrabold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-list-ol text-indigo-400 text-sm"></i> Video Episodes / Parts
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">যেকোনো পার্টে ক্লিক করে প্লে করুন</p>
                </div>
                <!-- মোবাইলে ২ কলামের রেসপনসিভ গ্রিড এবং স্ক্রোল প্রব্লেম সলভড -->
                <div id="video-parts-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-2.5 pb-8 lg:pb-0">
                    <!-- ডাইনামিক বাটন ইনসার্ট হবে -->
                </div>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <header id="navbar-header" class="container mx-auto px-4 sm:px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-2 font-bold text-xl sm:text-2xl tracking-wide text-indigo-400">
            <i class="fa-solid fa-bolt animate-pulse"></i> ZipStream
        </div>
        <div class="text-[10px] sm:text-xs font-semibold px-2.5 py-1 bg-slate-800 border border-slate-700 text-slate-400 rounded-full">Dashboard Active</div>
    </header>

    <!-- Main Form Dashboard -->
    <main id="main-content" class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center">
        <div class="max-w-xl w-full text-center mb-6 sm:mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold mb-3 bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                Multi-Part Video Shortener
            </h1>
            <p class="text-slate-400 text-sm sm:text-base px-2">
                ভিডিও পার্টগুলো একসাথে যুক্ত করে সুরক্ষিত এবং সুপার-শর্ট লিংক তৈরি করুন।
            </p>
        </div>

        <!-- Form Box -->
        <div class="bg-slate-800/50 backdrop-blur-md border border-slate-700/50 p-5 sm:p-8 rounded-2xl shadow-2xl max-w-xl w-full">
            <div id="dynamic-inputs-wrapper" class="space-y-3.5 mb-5">
                <div class="flex flex-col gap-1.5 relative">
                    <label class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider">Video Part 1:</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm"><i class="fa-solid fa-video"></i></span>
                        <input type="url" class="video-url-input w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm text-slate-200 placeholder-slate-600 transition" placeholder="https://example.com/part1.mp4">
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2.5 mb-5">
                <button onclick="addNewPartField()" class="w-full bg-slate-900 text-indigo-400 border border-indigo-500/20 font-semibold px-4 py-3.5 rounded-xl text-sm transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-plus text-xs"></i> Add Video Part
                </button>
                <button onclick="buildSecureStream()" class="w-full bg-indigo-600 text-white font-bold px-6 py-3.5 rounded-xl text-sm shadow-xl shadow-indigo-600/10 transition flex items-center justify-center gap-2 cursor-pointer">
                    Generate Short Link <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                </button>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="p-4 bg-slate-900/80 border border-indigo-500/30 rounded-xl hidden flex-col justify-between items-center gap-3">
                <div class="text-left w-full">
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block mb-0.5"><i class="fa-solid fa-circle-check"></i> Short Link Ready:</span>
                    <a id="shortUrl" href="#" target="_blank" class="text-indigo-400 font-semibold text-sm break-all hover:underline"></a>
                </div>
                <button onclick="copyLink()" id="copyBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-regular fa-copy"></i> Copy Link
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer-section" class="border-t border-slate-800 py-4 text-center text-[10px] text-slate-500">
        &copy; 2026 ZipStream. Powered by GitHub Pages.
    </footer>

    <!-- Logic Script -->
    <script>
        let fieldCount = 1;

        function addNewPartField() {
            fieldCount++;
            const container = document.getElementById('dynamic-inputs-wrapper');
            
            const newFieldDiv = document.createElement('div');
            newFieldDiv.className = "flex flex-col gap-1.5 relative mt-3";
            newFieldDiv.id = `field-group-${fieldCount}`;
            newFieldDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider">Video Part ${fieldCount}:</label>
                    <button onclick="removeField(${fieldCount})" class="text-[10px] text-rose-400 hover:underline flex items-center gap-0.5 cursor-pointer"><i class="fa-solid fa-trash-can"></i> Remove</button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm"><i class="fa-solid fa-video"></i></span>
                    <input type="url" class="video-url-input w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm text-slate-200 placeholder-slate-600 transition" placeholder="https://example.com/part${fieldCount}.mp4">
                </div>
            `;
            container.appendChild(newFieldDiv);
        }

        function removeField(id) {
            const field = document.getElementById(`field-group-${id}`);
            if (field) field.remove();
        }

        function buildSecureStream() {
            const inputs = document.querySelectorAll('.video-url-input');
            const urlArray = [];

            inputs.forEach(input => {
                const value = input.value.trim();
                if (value && (value.startsWith('http://') || value.startsWith('https://'))) {
                    urlArray.push(value);
                }
            });

            if (urlArray.length === 0) {
                alert("দয়া করে কমপক্ষে ১টি সঠিক ভিডিও লিংক প্রদান করুন।");
                return;
            }

            const encodedStream = URLDataEngine.encode(urlArray);
            const finalShortLink = window.location.origin + window.location.pathname + "?stream=" + encodedStream;

            const shortUrlA = document.getElementById('shortUrl');
            shortUrlA.textContent = finalShortLink;
            shortUrlA.href = finalShortLink;

            document.getElementById('copyBtn').innerHTML = '<i class="fa-regular fa-copy"></i> Copy Link';
            document.getElementById('resultBox').style.display = 'flex';
        }

        function copyLink() {
            const shortUrlText = document.getElementById('shortUrl').textContent;
            const copyBtn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(shortUrlText).then(function() {
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copied!';
            }, function() {
                alert("ম্যানুয়ালি কপি করুন।");
            });
        }
    </script>
</body>
</html>
